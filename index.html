<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kei.AI V2</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.2/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="layout">
    <div class="panel" style="max-width:720px;">
      <h1>Kei.AI V2</h1>
      <p class="subtitle">Text chat mode</p>

      <form id="chatForm">
        <label for="chatInput" style="display:block; margin-bottom:8px; font-weight:600;">Type a message for Kei</label>
        <textarea id="chatInput" rows="4" style="width:100%; box-sizing:border-box; resize:vertical;" placeholder="Ask Kei anything..."></textarea>
        <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
          <button type="submit" id="sendBtn">Send</button>
        </div>
      </form>

      <div id="speechOutput" style="margin-top:16px;">Voice input is temporarily disabled. Type a message below to chat with Kei.</div>
      <div id="llmOutput" aria-live="polite" style="margin-top:12px; white-space:pre-wrap;"></div>
    </div>

    <!-- <div id="avatar-area" style="position:fixed; right:18px; top:120px; width:360px; height:480px; pointer-events:auto;">
      <div id="avatar-container" style="width:100%; height:100%;"></div>
    </div>
  -->
  </div>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/speech.js"></script>
</body>
</html>
