<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kei.AI V2</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.2/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="layout">
    <div class="panel" style="max-width:720px;">
      <h1>Kei.AI V2</h1>
      <p class="subtitle">Voice recorder and transcription tool.</p>

      <div class="record-btns">
        <button id="recordBtn">Start Recording</button>
      </div>

      <div id="speechOutput">Press Enter (or click Start Recording), speak, then press Enter again to transcribe.</div>
      <div id="llmOutput" aria-live="polite"></div>

      <div class="voice-commands-list" style="margin-top:18px;">
        <p><strong>Notes:</strong></p>
        <ul>
          <li>Click the button or press <strong>Enter</strong> to start/stop recording.</li>
          <li>Transcription sent to <code>http://localhost:5000/transcribe</code> by default.</li>
        </ul>
      </div>
    </div>
    <div style="max-width:720px; margin-top:12px;">
      <label for="testAudioFile">Test audio (mp3/wav):</label>
      <input id="testAudioFile" type="file" accept="audio/*">
      <button id="playTestAudioBtn">Play Test Audio</button>
      <div style="margin-top:8px;">
        <button id="btnNeutral">Neutral</button>
        <button id="btnHappy">Happy</button>
        <button id="btnSad">Sad</button>
      </div>
    </div>

    <div id="avatar-area" style="position:fixed; right:18px; top:120px; width:360px; height:480px; pointer-events:auto;">
      <div id="avatar-container" style="width:100%; height:100%;"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/speech.js"></script>
</body>
</html>
